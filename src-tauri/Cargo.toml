[package]
name = "ai-excalidraw-desktop"
version = "0.5.0"
description = "AI-powered Excalidraw desktop canvas"
authors = ["AI Excalidraw contributors"]
license = "MIT"
repository = "https://github.com/lsiten/ai-excalidraw"
edition = "2021"
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-single-instance = "2"
axum = "0.8"
toml_edit = "0.20.2"
reqwest = { version = "0.12.28", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "time", "process", "io-util", "fs", "macros"] }
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
